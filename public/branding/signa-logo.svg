<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lt" x1="10" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A268"/>
      <stop offset="60%" stop-color="#00E898"/>
      <stop offset="100%" stop-color="#00F7AC"/>
    </linearGradient>
    <linearGradient id="dk" x1="10" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007048"/>
      <stop offset="100%" stop-color="#009A62"/>
    </linearGradient>
    <linearGradient id="md" x1="10" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#008050"/>
      <stop offset="100%" stop-color="#00B570"/>
    </linearGradient>
  </defs>

  <!-- Lower arm (left-biased, drawn first = behind) -->
  <polygon points="12,63 62,38 70,47 20,72" fill="url(#lt)"/>
  <polygon points="62,38 70,47 70,63 62,54" fill="url(#md)"/>
  <polygon points="20,72 70,47 70,63 20,88" fill="url(#dk)"/>

  <!-- Upper arm (right-biased, drawn last = in front) -->
  <polygon points="30,40 80,15 88,24 38,49" fill="url(#lt)"/>
  <polygon points="30,40 38,49 38,65 30,56" fill="url(#md)"/>
  <polygon points="38,49 88,24 88,40 38,65" fill="url(#dk)"/>
</svg>